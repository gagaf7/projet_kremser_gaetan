<div class="auth-container">
  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <h2>Se connecter</h2>
    
    <div class="form-group">
      <label for="email">Email *</label>
      <input 
        id="email" 
        type="email" 
        formControlName="email" 
        placeholder="votre@email.com"
      />
      @if (formControls['email'].touched && formControls['email'].invalid) {
        <div class="error">Email valide requis.</div>
      }
    </div>

    <div class="form-group">
      <label for="password">Mot de passe *</label>
      <input 
        id="password" 
        type="password" 
        formControlName="password" 
        placeholder="••••••••"
      />
      @if (formControls['password'].touched && formControls['password'].invalid) {
        <div class="error">Mot de passe requis.</div>
      }
    </div>

    <button type="submit" [disabled]="form.invalid">Se connecter</button>

    <p class="switch-auth">
      Pas de compte ? <a routerLink="/sign-up">Créer un compte</a>
    </p>
  </form>
</div>
