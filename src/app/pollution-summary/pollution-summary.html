<div class="pollution-summary">
  <ng-container *ngIf="loading; else content">
    <div>Chargement...</div>
  </ng-container>

  <ng-template #content>
    <ng-container *ngIf="error; else pollutionContent">
      <div class="error">{{ error }}</div>
      <button (click)="goBack()">Retour à la liste</button>
    </ng-container>

    <ng-template #pollutionContent>
      <div class="summary-container" *ngIf="pollution">
        <button class="back-btn" (click)="goBack()">← Retour</button>
        
        <div class="summary-header">
          <h1>{{ pollution.titre }}</h1>
          <span class="badge">{{ pollution.type }}</span>
        </div>

        <img *ngIf="pollution.photoUrl" [src]="pollution.photoUrl" alt="Photo" class="summary-photo"/>

        <div class="summary-details">
          <div class="detail-group">
            <label>Description</label>
            <p>{{ pollution.description }}</p>
          </div>

          <div class="detail-group">
            <label>Lieu</label>
            <p>{{ pollution.lieu }}</p>
          </div>

          <div class="detail-group">
            <label>Date d'observation</label>
            <p>{{ pollution.dateObservation | date:'mediumDate' }}</p>
          </div>

          <div class="detail-group">
            <label>Coordonnées</label>
            <p>{{ pollution.latitude }}, {{ pollution.longitude }}</p>
          </div>
        </div>

        <div class="summary-actions">
          <button 
            class="favorite-btn"
            [class.active]="isFavorite()"
            (click)="toggleFavorite()"
          >
            <span *ngIf="isFavorite()">♥ Retirer des favoris</span>
            <span *ngIf="!isFavorite()">♡ Ajouter aux favoris</span>
          </button>
          <ng-container *ngIf="isAuthenticated$ | async">
            <a class="btn-modifier" [routerLink]="['/pollutions/edit', pollution.id]">Modifier</a>
            <button class="delete-btn" (click)="deletePollution()">Supprimer</button>
          </ng-container>
          <button class="back-btn" (click)="goBack()">Retour à la liste</button>
        </div>
      </div>
    </ng-template>
  </ng-template>
</div>
